name: Build CV PDFs

on:
  push:
    branches: [master]
    paths:
      - '_base/**.tex'
      - 'todo/brasilparalelo/**.tex'
      - 'resume.yaml'
      - 'build.py'
      - 'assets/**.css'
      - 'index.html'
      - 'README.md'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  check-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Regenerate web version from resume.yaml
        run: python3 build.py

      - name: Fail if index.html / README.md are out of sync with resume.yaml
        run: |
          if ! git diff --quiet -- index.html README.md; then
            echo "::error::index.html or README.md is out of sync with resume.yaml. Run 'python3 build.py' and commit the result."
            git --no-pager diff -- index.html README.md
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Compile PT resume
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Patrick_Serrano_CV_2026.tex
          working_directory: _base

      - name: Compile EN resume
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Patrick_Serrano_CV_EN_2026.tex
          working_directory: _base

      - name: Compile Brasil Paralelo resume
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Patrick_Serrano_CV_BrasilParalelo_2026.tex
          working_directory: todo/brasilparalelo

      - name: Upload PDFs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdfs-${{ github.sha }}
          path: |
            _base/Patrick_Serrano_CV_2026.pdf
            _base/Patrick_Serrano_CV_EN_2026.pdf
            todo/brasilparalelo/Patrick_Serrano_CV_BrasilParalelo_2026.pdf
          retention-days: 90
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            _base/Patrick_Serrano_CV_2026.pdf
            _base/Patrick_Serrano_CV_EN_2026.pdf
          generate_release_notes: false
          body: |
            CV PDFs compiled from LaTeX source at `_base/`.

            | File | Language |
            |---|---|
            | `Patrick_Serrano_CV_2026.pdf` | Portuguese |
            | `Patrick_Serrano_CV_EN_2026.pdf` | English |
